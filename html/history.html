<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Transaksi — TopUpIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div data-chrome="header" data-active="history"></div>

<main class="account-shell">
  <div class="container">
    <div class="account-header">
      <div>
        <h1>Riwayat Transaksi</h1>
        <p class="sub">Semua pesanan yang pernah kamu lakukan, terbaru di atas.</p>
      </div>
      <a href="../html/catalog.html" class="btn btn-outline">← Belanja Lagi</a>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="label">Total Transaksi</div>
        <div class="value" id="h-count"></div>
      </div>
      <div class="stat-card">
        <div class="label">Total Belanja</div>
        <div class="value" id="h-total"></div>
      </div>
      <div class="stat-card">
        <div class="label">Transaksi Berhasil</div>
        <div class="value" id="h-ok"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>Daftar Transaksi</h3>
          <div class="sub">Saring berdasarkan status atau cari order tertentu</div>
        </div>
      </div>
      <div class="history-tools">
        <div class="filter-tabs" id="status-tabs"></div>
        <div class="search-bar hs">
          <span class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="search" id="h-search" placeholder="Cari order / item...">
        </div>
      </div>
      <table class="tx-table">
        <thead>
          <tr><th>ID Order</th><th>Produk</th><th>Qty</th><th>Total</th><th>Status</th><th>Tanggal</th></tr>
        </thead>
        <tbody id="tx-body"></tbody>
      </table>
    </div>
  </div>
</main>

<div data-chrome="footer"></div>

<script src="../js/auth.js"></script>
<script>requireRole(['user', 'admin']);</script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/script.js"></script>
<script src="../js/history.js"></script>
</body>
</html>
